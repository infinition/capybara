[package]
name = "capybara"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Emulateur bare-metal du Sonix SNC73410, compatible avec le firmware Tamagotchi Paradise"
repository = "https://github.com/infinition/capybara"

[dependencies]
# Moteur wgpu et non glow. Sur Windows, le compositeur du bureau ignore la
# couche alpha des fenetres OpenGL : la fenetre du mode jeu restait sur fond
# noir au lieu d'etre decoupee. wgpu passe par Direct3D et compose correctement.
eframe = { version = "0.29", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.29"
rodio = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
directories = "5.0"
byteorder = "1.5"
rfd = "0.15"
log = "0.4"
# Decodage des images de fond glissees sous la fenetre transparente. Seuls les
# formats qu'on rencontre vraiment sont actives, le reste alourdirait pour rien.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "gif",
    "webp",
] }

# Le coeur est un interpreteur : il passe son temps dans une poignee de
# fonctions qui s'appellent des millions de fois par seconde. L'optimisation
# entre modules et une seule unite de generation permettent de les fondre, ce
# qui compte bien plus ici que le temps de compilation.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
